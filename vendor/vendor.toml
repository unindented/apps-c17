# The vendored projects, one table for each directory of `vendor/`, which `vendor/vendor.py` checks
# and updates. Each pin is recorded here once. `vendor.py sync` copies it to the `Vendored at` line
# of every `THIRD_PARTY_NOTICES.md` that lists the project, and Renovate updates `release`.
#
# - `url`, `release` and `commit`: the upstream repository, the release tag without its `v`, and the
#   commit. A project without `release` is pinned by commit alone. Renovate reads `url` and
#   `release`, so they come first, in this order.
# - `notice`: the name of the project's heading in the notices, when it is not the directory's name.
# - `files` and `exclude`: patterns of upstream paths. `*` matches within one path segment, and
#   `**/` matches any number of directories.
# - `strip`: a prefix that the copy removes from each upstream path.
# - `patches`: patches under `vendor/patches/`, applied to the copy in order.
# - `local`: patterns of files this repository writes, such as configuration headers that upstream
#   generates in its build. The check skips them, and a sync keeps them.
# - `queries`: upstream query files whose patterns `libs/markup/queries/` keeps, whose diff a sync
#   prints to port.

[acutest]
url = "https://github.com/mity/acutest"
commit = "31751b4089c93b46a9fd8a8183a695f772de66de"
files = ["LICENSE.md", "include/acutest.h"]
strip = "include/"

[copt]
url = "https://github.com/fardaniqbal/copt"
commit = "1b466222f51ac59cc6c972d68afa340b4e024d71"
files = ["LICENSE", "copt.h"]

[libjpeg-turbo]
url = "https://github.com/libjpeg-turbo/libjpeg-turbo"
release = "3.2.0"
commit = "c85e6b905bf237038faa936dab160ebfc5da0344"
files = [
  "LICENSE.md",
  "README.ijg",
  "simd/*.c",
  "simd/*.h",
  "simd/arm/*.c",
  "simd/arm/*.h",
  "simd/arm/aarch64/*",
  "simd/nasm/*",
  "simd/x86_64/*",
  "src/*.c",
  "src/*.h",
  "src/wrapper/*.c",
]
# The programs, the TurboJPEG API, the tests and the templates of the generated headers.
exclude = [
  "simd/simdcoverage.c",
  "src/bmpsizetest.c",
  "src/cderror.h",
  "src/cdjpeg.*",
  "src/cjpeg.c",
  "src/cmyk.h",
  "src/djpeg.c",
  "src/example.c",
  "src/jcstest.c",
  "src/jdatadst-tj.c",
  "src/jdatasrc-tj.c",
  "src/jpegtran.c",
  "src/rd*.c",
  "src/strtest.c",
  "src/tj*",
  "src/transupp.*",
  "src/turbojpeg*",
  "src/wr*.c",
  "src/wrapper/rd*.c",
  "src/wrapper/template.c",
  "src/wrapper/wr*.c",
]
local = ["config/*"]

[libwebp]
url = "https://chromium.googlesource.com/webm/libwebp"
release = "1.6.0"
commit = "4fa21912338357f89e4fd51cf2368325b59e9bd9"
files = [
  "AUTHORS",
  "COPYING",
  "PATENTS",
  "sharpyuv/*.c",
  "sharpyuv/*.h",
  "src/dec/*.c",
  "src/dec/*.h",
  "src/dsp/*.c",
  "src/dsp/*.h",
  "src/enc/*.c",
  "src/enc/*.h",
  "src/utils/*.c",
  "src/utils/*.h",
  "src/webp/*.h",
]
# The MIPS routines, the demuxer and the muxer.
exclude = [
  "src/dsp/*_mips*",
  "src/dsp/*_msa.c",
  "src/dsp/mips_macro.h",
  "src/dsp/msa_macro.h",
  "src/webp/demux.h",
  "src/webp/mux.h",
]

[md4c]
url = "https://github.com/mity/md4c"
commit = "f9e5eb232b95b737373ae706648cb75bd259ed1a"
files = ["LICENSE.md", "src/md4c.c", "src/md4c.h"]
strip = "src/"

[mustache4c]
