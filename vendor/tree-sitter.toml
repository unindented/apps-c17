# The files that `vendor/tree-sitter.py` copies from each tree-sitter project into
# `vendor/<project>/`. `apps/sosig/THIRD_PARTY_NOTICES.md` records the release and the commit of
# each project, and Renovate updates the release there.
#
# `files` and `exclude` are patterns of upstream paths, in which `*` also matches `/`. `strip` is a
# prefix that the copy removes from each path. `queries` names the upstream query files whose
# patterns the `markup` library keeps in `libs/markup/queries/`, so a bump prints their diff to
# port.

[tree-sitter]
files = ["LICENSE", "lib/include/*", "lib/src/*"]
exclude = ["lib/src/wasm-stdlib/*"]
strip = "lib/"

[tree-sitter-c]
files = ["LICENSE", "src/*.c", "src/*.h"]
queries = ["queries/highlights.scm"]

[tree-sitter-bash]
files = ["LICENSE", "src/*.c", "src/*.h"]
queries = ["queries/highlights.scm"]

[tree-sitter-html]
files = ["LICENSE", "src/*.c", "src/*.h"]
queries = ["queries/highlights.scm"]

[tree-sitter-css]
files = ["LICENSE", "src/*.c", "src/*.h"]
queries = ["queries/highlights.scm"]

[tree-sitter-javascript]
files = ["LICENSE", "src/*.c", "src/*.h"]
queries = ["queries/highlights.scm", "queries/highlights-jsx.scm", "queries/highlights-params.scm"]

[tree-sitter-typescript]
files = [
  "LICENSE",
  "common/*.h",
  "typescript/src/*.c",
  "typescript/src/*.h",
  "tsx/src/*.c",
  "tsx/src/*.h",
]
queries = ["queries/highlights.scm"]

[tree-sitter-json]
files = ["LICENSE", "src/*.c", "src/*.h"]
queries = ["queries/highlights.scm"]
